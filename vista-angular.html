<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vista previa</title>
<style>
    html, body { margin: 0; padding: 0; background: #fff; }
    body { padding: 12px 14px; font-family: system-ui, 'Segoe UI', sans-serif; color: #212121; }
    #__aviso {
        font: 13px/1.5 system-ui, sans-serif; color: #6b7785;
        padding: 6px 0;
    }
</style>
</head>
<body>
<div id="__aviso">Cargando Angular…</div>
<app-root></app-root>

<script src="vendor/ts-runtime.js?v=ts5.5.4"></script>
<script src="vendor/angular-runtime.js?v=ng18.2.14-http"></script>
<script src="js/angular/api-simulada.js?v=1"></script>
<script>
(function () {
    'use strict';

    (function () {
        var R = window.Reflect;
        if (!R || typeof R.getOwnMetadata === 'function') return;
        var almacen = new WeakMap();
        function clave(k, p) { return String(k) + '|' + (p === undefined ? '' : String(p)); }
        function tabla(o, crear) {
            var t = almacen.get(o);
            if (!t && crear) { t = {}; almacen.set(o, t); }
            return t;
        }
        R.defineMetadata = function (k, v, o, p) { tabla(o, true)[clave(k, p)] = v; };
        R.metadata = function (k, v) { return function (o, p) { R.defineMetadata(k, v, o, p); }; };
        R.getOwnMetadata = function (k, o, p) { var t = tabla(o, false); return t ? t[clave(k, p)] : undefined; };
        R.hasOwnMetadata = function (k, o, p) { var t = tabla(o, false); return !!t && (clave(k, p) in t); };
        R.getMetadata = R.getOwnMetadata;
        R.hasMetadata = R.hasOwnMetadata;
    })();

    var A = window.__ANGULAR__;
    var T = window.__TS__;

    function avisarPadre(msg) { parent.postMessage(msg, '*'); }

    /* ------------------------------------------------------------------------
     * Errores: todo lo que Angular protesta llega por console.error
     * ---------------------------------------------------------------------- */

    var errores = [];
    var registro = [];
    var backend = ApiSimulada.crearBackend(A);

    function texto(args) {
        return Array.prototype.map.call(args, function (a) {
            if (a instanceof Error) return a.name + ': ' + a.message;
            if (typeof a === 'string') return a;
            try { return JSON.stringify(a); } catch (e) { return String(a); }
        }).join(' ');
    }

    var RUIDO = [/^Angular is running in development mode/, /^NG0912:/];

    ['log', 'info', 'warn', 'error'].forEach(function (nivel) {
        console[nivel] = function () {
            var t = texto(arguments);
            if (RUIDO.some(function (re) { return re.test(t); })) return;
            if (nivel === 'error') errores.push(t); else registro.push(t);
            avisarPadre({ tipo: 'consola', nivel: nivel === 'info' ? 'log' : nivel, texto: t });
        };
    });

    window.addEventListener('error', function (e) {
        var t = (e.error ? e.error.name + ': ' + e.error.message : e.message) || 'Error desconocido';
        errores.push(t);
        avisarPadre({ tipo: 'consola', nivel: 'error', texto: t });
    });
    window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        var t = r && r.message ? (r.name || 'Error') + ': ' + r.message : String(r);
        errores.push(t);
        avisarPadre({ tipo: 'consola', nivel: 'error', texto: t });
    });

    /* ------------------------------------------------------------------------
     * Módulos que el alumno puede importar
     * ---------------------------------------------------------------------- */

    var MODULOS = {
        '@angular/core': A.core,
        '@angular/common': A.common,
        '@angular/forms': A.forms,
        '@angular/common/http': A.http,
        '@angular/router': A.router,
        '@angular/platform-browser': A.platformBrowser,
        'rxjs': A.rxjs,
        'rxjs/operators': A.rxjsOps
    };

    /* ------------------------------------------------------------------------
     * Compilar
     * ---------------------------------------------------------------------- */

    var nombreActual = '';

    function compilar(nombre, fuente) {
        nombreActual = nombre;
        var r = T.transpileModule(fuente, {
            fileName: nombre,
            reportDiagnostics: true,
            compilerOptions: {
                module: T.ModuleKind.CommonJS,
                target: T.ScriptTarget.ES2022,
                experimentalDecorators: true,
                useDefineForClassFields: false,
                verbatimModuleSyntax: true,
                emitDecoratorMetadata: true
            }
        });
        var graves = (r.diagnostics || []).filter(function (d) { return d.category === 1; });
        if (graves.length) {
            var d = graves[0];
            var linea = null;
            if (d.file && typeof d.start === 'number') {
                linea = d.file.text.slice(0, d.start).split('\n').length;
            }
            var msg = typeof d.messageText === 'string' ? d.messageText
                    : (d.messageText && d.messageText.messageText) || 'Error de sintaxis';
            var e = new Error(msg);
            e.name = 'SyntaxError';
            e.archivo = nombre;
            e.linea = linea;
            throw e;
        }
        return r.outputText;
    }

    /* ------------------------------------------------------------------------
     * Un mini require de archivos del alumno
     * ---------------------------------------------------------------------- */

    function normalizar(desde, pedido) {
        var base = desde.split('/').slice(0, -1);
        pedido.split('/').forEach(function (p) {
            if (p === '.' || p === '') return;
            if (p === '..') base.pop(); else base.push(p);
        });
        return base.join('/');
    }

    function resolverArchivo(archivos, ruta) {
        var candidatos = [ruta, ruta + '.ts', ruta + '.js', ruta + '/index.ts'];
        for (var i = 0; i < candidatos.length; i++) {
            if (Object.prototype.hasOwnProperty.call(archivos, candidatos[i])) return candidatos[i];
        }
        return null;
    }

    function incrustar(archivos, desde, fuente) {
        function leer(ruta) {
            var destino = normalizar(desde, ruta);
            if (!Object.prototype.hasOwnProperty.call(archivos, destino)) {
                var e = new Error("No se encuentra el archivo '" + ruta + "' que pide " + desde + '.');
                e.name = 'ModuleNotFound';
                e.archivo = desde;
                throw e;
            }
            return archivos[destino];
        }
        return fuente
            .replace(/templateUrl\s*:\s*(['"])([^'"]+)\1/g, function (todo, q, ruta) { return 'template: ' + JSON.stringify(leer(ruta)); })
            .replace(/styleUrl\s*:\s*(['"])([^'"]+)\1/g, function (todo, q, ruta) { return 'styles: ' + JSON.stringify(leer(ruta)); })
            .replace(/styleUrls\s*:\s*\[([^\]]*)\]/g, function (todo, lista) {
                var rutas = lista.match(/['"][^'"]+['"]/g) || [];
                return 'styles: [' + rutas.map(function (r) { return JSON.stringify(leer(r.slice(1, -1))); }).join(', ') + ']';
            });
    }

    function cargar(archivos, cache, nombre) {
        if (cache[nombre]) return cache[nombre].exports;
        var modulo = { exports: {} };
        cache[nombre] = modulo;

        var js = compilar(nombre, incrustar(archivos, nombre, archivos[nombre]));
        function pedir(que) {
            if (que.charAt(0) === '.') {
                var destino = resolverArchivo(archivos, normalizar(nombre, que));
                if (!destino) {
                    var e = new Error("No se encuentra el módulo '" + que + "' desde " + nombre + ".");
                    e.name = 'ModuleNotFound';
                    e.archivo = nombre;
                    throw e;
                }
                return cargar(archivos, cache, destino);
            }
            if (MODULOS[que]) return MODULOS[que];
            var e2 = new Error("No se encuentra el módulo '" + que + "'. En esta clase se puede importar " +
                               "desde @angular/core, @angular/common, @angular/forms, @angular/common/http, rxjs y tus propios archivos.");
            e2.name = 'ModuleNotFound';
            e2.archivo = nombre;
            throw e2;
        }
        new Function('require', 'exports', 'module', js)(pedir, modulo.exports, modulo);
        return modulo.exports;
    }

    /* ------------------------------------------------------------------------
     * Ejecutar
     * ---------------------------------------------------------------------- */

    var appRef = null;

    function destruir() {
        try { if (appRef) appRef.destroy(); } catch (e) { }
        appRef = null;
        try {
            var plataforma = A.core.getPlatform();
            if (plataforma) plataforma.destroy();
        } catch (e) { }
        var raiz = document.querySelector('app-root');
        if (raiz) { raiz.parentNode.removeChild(raiz); }
        var nueva = document.createElement('app-root');
        document.body.appendChild(nueva);
        Array.prototype.slice.call(document.head.querySelectorAll('style[ng-app-id], style[ng-version]'))
            .forEach(function (s) { s.parentNode.removeChild(s); });
    }

    function ejecutar(orden) {
        errores = [];
        registro = [];
        backend.reiniciarPedidos();
        destruir();
        document.getElementById('__aviso').style.display = 'none';

        var archivos = orden.archivos || {};
        var entrada = orden.entrada || 'app/app.component.ts';

        if (!Object.prototype.hasOwnProperty.call(archivos, entrada)) {
            return Promise.resolve({
                ok: false, fase: 'proyecto',
                titulo: 'Falta el archivo ' + entrada,
                detalle: 'La aplicación arranca desde ese archivo y todavía no existe.'
            });
        }

        var archivoModulo = 'app/app.module.ts';
        var conModulos = Object.prototype.hasOwnProperty.call(archivos, archivoModulo);

        var exportado, exportadoModulo = null;
        var cache = {};
        var archivoConfig = 'app/app.config.ts';
        var exportadoConfig = null;
        try {
            exportado = cargar(archivos, cache, entrada);
            if (conModulos) exportadoModulo = cargar(archivos, cache, archivoModulo);
            if (!conModulos && Object.prototype.hasOwnProperty.call(archivos, archivoConfig)) exportadoConfig = cargar(archivos, cache, archivoConfig);
        } catch (e) {
            return Promise.resolve({
                ok: false, fase: 'codigo',
                titulo: e.name === 'SyntaxError' ? 'Tu código no compila' : 'Tu código se rompió al cargar',
                error: { nombre: e.name, mensaje: e.message, archivo: e.archivo || nombreActual, linea: e.linea || null }
            });
        }

        var Raiz = exportado.AppComponent;
        if (!Raiz && !conModulos) {
            return Promise.resolve({
                ok: false, fase: 'proyecto',
                titulo: 'No encuentro la clase AppComponent',
                detalle: 'En ' + entrada + ' tiene que haber una clase exportada llamada AppComponent: es la que arranca la aplicación.'
            });
        }
        if (conModulos && !exportadoModulo.AppModule) {
            return Promise.resolve({
                ok: false, fase: 'proyecto',
                titulo: 'No encuentro la clase AppModule',
                detalle: 'En ' + archivoModulo + ' tiene que haber una clase exportada llamada AppModule, con el decorador @NgModule.'
            });
        }

        var arranque = conModulos
            ? A.platformBrowserDynamic().bootstrapModule(exportadoModulo.AppModule)
            : A.platformBrowser.bootstrapApplication(Raiz, {
                providers: ((exportadoConfig && exportadoConfig.appConfig && exportadoConfig.appConfig.providers) || [])
                    .concat([{ provide: A.http.HttpBackend, useValue: backend }])
            });

        return arranque
            .then(function (ref) {
                appRef = ref;
                return new Promise(function (ok) { setTimeout(ok, 60); });
            })
            .then(function () {
                return { ok: true, errores: errores.slice(), html: document.querySelector('app-root').innerHTML };
            })
            .catch(function (e) {
                return {
                    ok: false, fase: 'arranque',
                    titulo: 'Angular no pudo arrancar la aplicación',
                    error: { nombre: (e && e.name) || 'Error', mensaje: (e && e.message) || String(e), archivo: entrada, linea: null },
                    errores: errores.slice()
                };
            });
    }

    /* ------------------------------------------------------------------------
     * Inspección
     * ---------------------------------------------------------------------- */

    function espera() { return new Promise(function (ok) { setTimeout(ok, 50); }); }

    function inspeccionar(consulta) {
        try {
            if (consulta.contar !== undefined) {
                return Promise.resolve({ cantidad: document.querySelectorAll(consulta.contar).length });
            }
            if (consulta.tiene !== undefined) {
                return Promise.resolve({ existe: !!document.querySelector(consulta.tiene) });
            }
            if (consulta.textos !== undefined) {
                var lista = Array.prototype.map.call(document.querySelectorAll(consulta.textos), function (el) {
                    return (el.textContent || '').replace(/\s+/g, ' ').trim();
                });
                return Promise.resolve({ textos: lista });
            }
            if (consulta.atributo) {
                var el = document.querySelector(consulta.atributo[0]);
                return Promise.resolve({ existe: !!el, valor: el ? el.getAttribute(consulta.atributo[1]) : null });
            }
            if (consulta.propiedad) {
                var el2 = document.querySelector(consulta.propiedad[0]);
                return Promise.resolve({ existe: !!el2, valor: el2 ? el2[consulta.propiedad[1]] : null });
            }
            if (consulta.pedidos !== undefined) {
                return Promise.resolve({ pedidos: backend.estado.pedidos.slice() });
            }
            if (consulta.red !== undefined) {
                backend.estado.red = consulta.red;
                return Promise.resolve({ hecho: true });
            }
            if (consulta.registro !== undefined) {
                return Promise.resolve({ registro: registro.slice() });
            }
            if (consulta.enfocado !== undefined) {
                var foc = document.querySelector(consulta.enfocado);
                return Promise.resolve({ existe: !!foc, enfocado: !!foc && document.activeElement === foc });
            }
            if (consulta.clic !== undefined) {
                var b = document.querySelector(consulta.clic);
                if (!b) return Promise.resolve({ hecho: false });
                b.click();
                return espera().then(function () { return { hecho: true }; });
            }
            if (consulta.elegir) {
                var sel = document.querySelector(consulta.elegir[0]);
                if (!sel) return Promise.resolve({ hecho: false });
                sel.value = consulta.elegir[1];
                sel.dispatchEvent(new Event('change', { bubbles: true }));
                return espera().then(function () { return { hecho: true }; });
            }
            if (consulta.escribir) {
                var campo = document.querySelector(consulta.escribir[0]);
                if (!campo) return Promise.resolve({ hecho: false });
                campo.value = consulta.escribir[1];
                campo.dispatchEvent(new Event('input', { bubbles: true }));
                return espera().then(function () { return { hecho: true }; });
            }
            return Promise.resolve({ error: 'Consulta desconocida' });
        } catch (e) {
            return Promise.resolve({ error: String(e && e.message) });
        }
    }

    window.addEventListener('message', function (evento) {
        var d = evento.data || {};
        if (d.tipo === 'ejecutar') {
            ejecutar(d).then(function (r) {
                r.tipo = 'resultado'; r.id = d.id;
                avisarPadre(r);
            });
        } else if (d.tipo === 'inspeccionar') {
            inspeccionar(d.consulta || {}).then(function (r) {
                r.tipo = 'respuesta'; r.id = d.id;
                avisarPadre(r);
            });
        }
    });

    avisarPadre({ tipo: 'listo', angular: A.core.VERSION.full, typescript: T.version });
})();
</script>
</body>
</html>
